name: Change scope

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate changed paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: node scripts/change-scope/check.mjs --branch "$HEAD_REF" --base "$BASE_SHA"
